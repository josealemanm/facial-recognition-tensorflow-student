[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "facenet-student"
version = "0.1.0"
description = "A modern TensorFlow face-embedding pipeline for educational use"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Student Project Contributors" }]
keywords = ["tensorflow", "embeddings", "computer-vision", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<2.1",
  "Pillow>=10,<13",
  "scikit-learn>=1.4,<1.8",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.16,<2.22"]
vision = ["opencv-python-headless>=4.9,<5"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
facenet-student = "facenet_student.cli:main"

[project.urls]
Original-Tutorial = "https://hackernoon.com/building-a-facial-recognition-pipeline-with-deep-learning-in-tensorflow-66e7645015b8"
Original-Repository = "https://github.com/ColeMurray/medium-facenet-tutorial"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facenet_student = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
exclude = [".venv", "build", "dist", "runs"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
